# Prometheus - RESILIENT configuration (generated)
global:
  scrape_interval: 2s
  evaluation_interval: 2s
  scrape_timeout: 1s
  external_labels:
    mode: resilient

rule_files:
  - /etc/prometheus/alert_rules.yml

scrape_configs:
  - job_name: student-service
    static_configs:
      - targets: ["student-1:8000", "student-2:8000"]
  - job_name: payment-service
    static_configs:
      - targets: ["payment-1:8000", "payment-2:8000"]
  - job_name: records-service
    static_configs:
      - targets: ["records-1:8000", "records-2:8000"]
  - job_name: timetable-service
    static_configs:
      - targets: ["timetable-1:8000"]
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
