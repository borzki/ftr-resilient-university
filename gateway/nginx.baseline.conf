# API gateway - BASELINE (midterm-scope) configuration:
# single upstream instance per service, nginx default timeouts (60 s),
# no rate limiting, no body-size hardening, internal endpoints reachable.
worker_processes auto;
events { worker_connections 4096; }

http {
    include /etc/nginx/mime.types;
    map $http_x_request_id $req_id {
        default $http_x_request_id;
        ""      $request_id;
    }
    log_format json escape=json '{"ts":"$time_iso8601","service":"gateway","request_id":"$req_id",'
        '"remote":"$remote_addr","method":"$request_method","uri":"$uri","status":$status,'
        '"duration_s":$request_time,"upstream":"$upstream_addr","upstream_status":"$upstream_status",'
        '"upstream_time":"$upstream_response_time"}';
    access_log /dev/stdout json;
    error_log /dev/stderr warn;

    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header X-Request-ID $req_id;

    upstream student_svc   { server student-1:8000;   keepalive 16; }
    upstream payment_svc   { server payment-1:8000;   keepalive 16; }
    upstream records_svc   { server records-1:8000;   keepalive 16; }
    upstream timetable_svc { server timetable-1:8000; keepalive 16; }

    server {
        listen 80;
        default_type application/json;
        add_header X-Request-ID $req_id always;

        location = /health { return 200 '{"status":"ok","gateway":"baseline"}'; }
        location /api/auth      { proxy_pass http://student_svc; }
        location /api/students  { proxy_pass http://student_svc; }
        location /api/dashboard { proxy_pass http://student_svc; }
        location /api/admin     { proxy_pass http://student_svc; }
        location /internal/students { proxy_pass http://student_svc; }
        location /api/payments  { proxy_pass http://payment_svc; }
        location /internal/accounts { proxy_pass http://payment_svc; }
        location /api/records   { proxy_pass http://records_svc; }
        location /api/timetable { proxy_pass http://timetable_svc; }
        location /internal/timetable { proxy_pass http://timetable_svc; }
        # web portal (static files)
        location = / { root /usr/share/nginx/html; try_files /index.html =404; }
        location /static/ { root /usr/share/nginx/html; }

        location / { return 404 '{"error":"not_found"}'; }
    }

    server {
        listen 8081;
        location /student/   { proxy_pass http://student_svc/; }
        location /payment/   { proxy_pass http://payment_svc/; }
        location /records/   { proxy_pass http://records_svc/; }
        location /timetable/ { proxy_pass http://timetable_svc/; }
    }
}
