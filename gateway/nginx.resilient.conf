# API gateway / load balancer - RESILIENT configuration
worker_processes auto;
events { worker_connections 4096; }

http {
    include /etc/nginx/mime.types;
    server_tokens off;

    # correlation ID: keep the client's X-Request-ID or generate one
    map $http_x_request_id $req_id {
        default $http_x_request_id;
        ""      $request_id;
    }
    # rate-limit key: the bearer token when present, otherwise the client IP
    map $http_authorization $api_limit_key {
        default $http_authorization;
        ""      $binary_remote_addr;
    }

    log_format json escape=json '{"ts":"$time_iso8601","service":"gateway","request_id":"$req_id",'
        '"remote":"$remote_addr","method":"$request_method","uri":"$uri","status":$status,'
        '"duration_s":$request_time,"upstream":"$upstream_addr","upstream_status":"$upstream_status",'
        '"upstream_time":"$upstream_response_time"}';
    access_log /dev/stdout json;
    error_log /dev/stderr warn;

    # abuse protection
    limit_req_zone $api_limit_key       zone=api_per_client:10m rate=25r/s;
    limit_req_zone $binary_remote_addr  zone=login_per_ip:10m   rate=60r/m;
    limit_req_status 429;
    client_max_body_size 16k;

    # timeouts and bounded failover to the other replica
    proxy_connect_timeout 1s;
    proxy_send_timeout 5s;
    proxy_read_timeout 5s;
    proxy_next_upstream error timeout http_502 http_504;   # POSTs are never re-sent (non_idempotent off)
    proxy_next_upstream_tries 2;
    proxy_next_upstream_timeout 4s;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Request-ID $req_id;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

    # replicas with passive health checking (ejected for 5s after 2 failures)
    upstream student_svc {
        server student-1:8000 max_fails=2 fail_timeout=5s;
        server student-2:8000 max_fails=2 fail_timeout=5s;
        keepalive 32;
    }
    upstream payment_svc {
        server payment-1:8000 max_fails=2 fail_timeout=5s;
        server payment-2:8000 max_fails=2 fail_timeout=5s;
        keepalive 32;
    }
    upstream records_svc {
        server records-1:8000 max_fails=2 fail_timeout=5s;
        server records-2:8000 max_fails=2 fail_timeout=5s;
        keepalive 32;
    }
    upstream timetable_svc {
        server timetable-1:8000 max_fails=2 fail_timeout=5s;
        keepalive 16;
    }

    # ---------------- public API (published on 127.0.0.1:8080) ----------------
    server {
        listen 80;
        default_type application/json;

        add_header X-Request-ID $req_id always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Cache-Control "no-store" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'none'; form-action 'self'" always;
        add_header Referrer-Policy no-referrer always;

        error_page 429 = @rate_limited;
        location @rate_limited { return 429 '{"error":"rate_limited"}'; }

        location = /health { return 200 '{"status":"ok","gateway":"resilient"}'; }

        location = /api/auth/login {
            limit_req zone=login_per_ip burst=60 nodelay;
            proxy_pass http://student_svc;
        }
        location /api/students  { limit_req zone=api_per_client burst=50 nodelay; proxy_pass http://student_svc; }
        location /api/dashboard { limit_req zone=api_per_client burst=50 nodelay; proxy_pass http://student_svc; }
        location /api/admin     { limit_req zone=api_per_client burst=50 nodelay; proxy_pass http://student_svc; }
        location /api/payments  { limit_req zone=api_per_client burst=50 nodelay; proxy_pass http://payment_svc; }
        location /api/records   { limit_req zone=api_per_client burst=50 nodelay; proxy_pass http://records_svc; }
        location /api/timetable { limit_req zone=api_per_client burst=50 nodelay; proxy_pass http://timetable_svc; }

        # web portal (static files)
        location = / { root /usr/share/nginx/html; try_files /index.html =404; }
        location /static/ { root /usr/share/nginx/html; }

        # internal, metrics and fault-injection endpoints are never exposed publicly
        location / { return 404 '{"error":"not_found"}'; }
    }

    # ---------------- internal service-to-service entry point (not published) --
    server {
        listen 8081;
        location /student/   { proxy_pass http://student_svc/; }
        location /payment/   { proxy_pass http://payment_svc/; }
        location /records/   { proxy_pass http://records_svc/; }
        location /timetable/ { proxy_pass http://timetable_svc/; }
    }
}
